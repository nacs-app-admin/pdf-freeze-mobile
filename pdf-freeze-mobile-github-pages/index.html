<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#202124"><title>PDF固定ビューワ</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<header><button id="open">PDFを開く</button><input id="file" type="file" accept="application/pdf" hidden><button id="prev">◀</button><span id="page">0 / 0</span><button id="next">▶</button><button id="minus">－</button><span id="zoom">100%</span><button id="plus">＋</button><button id="menu">固定</button></header>
<div id="panel" hidden><button data-mode="top">上部固定</button><button data-mode="left">左固定</button><button data-mode="both">上部＋左固定</button><button id="clear">固定解除</button></div>
<main id="stage"><div id="scroll"><div id="pageWrap"><canvas id="pdf"></canvas><div id="guide"><i></i><b></b></div></div></div><canvas id="top" class="pane"></canvas><canvas id="left" class="pane"></canvas><canvas id="corner" class="pane"></canvas><canvas id="body" class="pane"></canvas><div id="empty">「PDFを開く」から端末内のPDFを選択してください。<small>PDFはGitHubへ送信されず、この端末内だけで処理されます。</small></div></main>
<script type="module" src="app.js"></script></body></html>
